<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katia ❤️ Brasile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container" id="questionScreen">

        <div class="hearts">
            <span>❤️</span>
            <span>💕</span>
            <span>❤️</span>
            <span>💗</span>
            <span>💕</span>
        </div>

        <div class="card">

            <div class="emoji">🇧🇷❤️🇮🇹</div>

            <h1>Katia...</h1>

            <p class="question">
                Verrai in Brasile<br>
                a trovarmi? 🥺
            </p>

            <p class="subtext">
                Pensaci bene prima di rispondere...
            </p>

            <div class="buttons">
                <button id="yesButton">SÌ ❤️</button>
                <button id="noButton">NO 😈</button>
            </div>

            <p id="message"></p>

        </div>

    </main>


    <main class="success" id="successScreen">

        <div class="successOverlay"></div>

        <div class="successContent">

            <div class="bigHeart">❤️</div>

            <h1>EEEEBA!!!</h1>

            <h2>Ti sto aspettando, Katia 🥰</h2>

            <p>
                Adesso non puoi più tornare indietro...
            </p>

            <p class="small">
                Il Brasile ti sta già aspettando 🇧🇷
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
